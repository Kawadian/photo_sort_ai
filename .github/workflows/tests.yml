name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Install ExifTool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl python3-tk xvfb
      - name: Install ExifTool (Windows)
        if: runner.os == 'Windows'
        run: choco install exiftool -y --no-progress
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src
      - name: Parse Windows setup scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('install.ps1', 'startup.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: GUI smoke test (Windows)
        if: runner.os == 'Windows'
        run: python tests/gui_smoke.py
      - name: GUI smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/gui_smoke.py
      - name: Parse Linux scripts and run minimal installer
        if: runner.os == 'Linux'
        run: |
          for script in install.sh start.sh watch.sh; do bash -n "$script"; done
          ./install.sh --minimal --skip-exiftool
      - name: Run Windows minimal installer
        if: runner.os == 'Windows'
        shell: powershell
        run: .\install.ps1 -Minimal -SkipExifTool
